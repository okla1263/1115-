<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台南聚餐出遊．費用分攤明細</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #FFFCF6;
            --ink: #3E3A39;
            --coral: #F2A497;
            --yellow: #F6D27A;
            --blue: #A8D3E6;
            --green: #B9DAA5;
            --purple: #D4C1EC;
            --shadow: 3px 3px 0px #3E3A39;
            --border: 3px solid #3E3A39;
            --radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Zen Maru Gothic', sans-serif;
            color: var(--ink);
        }

        body {
            background-color: var(--paper);
            background-image: radial-gradient(#e5e0d8 1px, transparent 1px);
            background-size: 20px 20px;
            padding-bottom: 60px;
        }

        /* 頂端固定選單 */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: var(--paper);
            border-bottom: var(--border);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .nav-logo {
            font-weight: 700;
            background: var(--yellow);
            padding: 5px 12px;
            border: var(--border);
            border-radius: var(--radius);
            box-shadow: 2px 2px 0px var(--ink);
            font-size: 14px;
        }

        .nav-links {
            display: flex;
            gap: 8px;
        }

        .nav-btn {
            background: #fff;
            border: var(--border);
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--ink);
            text-decoration: none;
        }

        .nav-btn:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        /* 主容器 */
        .container {
            max-width: 600px;
            margin: 78px auto 20px auto;
            padding: 0 15px;
        }

        .card {
            background: #fff;
            border: var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 18px;
            margin-bottom: 20px;
        }

        /* 首頁標題卡 */
        .hero-banner {
            background: var(--coral);
            text-align: center;
        }

        .hero-title {
            font-size: 22px;
            font-weight: 700;
            margin: 10px 0 6px 0;
        }

        .hero-sub {
            font-size: 13px;
            background: #fff;
            display: inline-block;
            padding: 4px 12px;
            border: 2px solid var(--ink);
            border-radius: 12px;
            font-weight: 700;
        }

        /* 成員篩選列 */
        .filter-bar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 6px;
            margin-bottom: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: #fff;
            border: var(--border);
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--ink);
            transition: 0.15s;
        }

        .filter-btn.active {
            background: var(--blue);
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        /* 轉帳建議卡片 */
        .transfer-item {
            background: var(--paper);
            border: var(--border);
            border-radius: 15px;
            padding: 12px 14px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .transfer-item.done {
            opacity: 0.55;
            background: #eee;
        }

        .transfer-flow {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            font-size: 15px;
        }

        .person-badge {
            padding: 3px 9px;
            border-radius: 10px;
            border: 2px solid var(--ink);
            font-size: 13px;
        }

        .p-yijun { background: var(--coral); }
        .p-guanhong { background: var(--blue); }
        .p-pengwen { background: var(--green); }
        .p-chenbao { background: var(--yellow); }

        .amount-box {
            text-align: right;
        }

        .amount-text {
            font-size: 18px;
            font-weight: 700;
            display: block;
        }

        .copy-btn {
            background: #fff;
            border: 2px solid var(--ink);
            border-radius: 8px;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 4px;
        }

        .copy-btn:active {
            background: var(--yellow);
        }

        /* 互欠總額小卡 */
        .debt-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        @media (max-width: 450px) {
            .debt-grid {
                grid-template-columns: 1fr;
            }
        }

        .debt-card {
            background: var(--paper);
            border: 2px solid var(--ink);
            border-radius: 14px;
            padding: 10px 12px;
            font-size: 13px;
        }

        .debt-card h4 {
            margin-bottom: 6px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 逐筆明細列表 */
        .expense-item {
            border-bottom: 2px dashed #d8d0c5;
            padding: 12px 0;
        }

        .expense-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .expense-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 5px;
        }

        .expense-title {
            font-weight: 700;
            font-size: 15px;
        }

        .expense-total {
            font-weight: 700;
            font-size: 14px;
            background: var(--yellow);
            padding: 2px 8px;
            border-radius: 8px;
            border: 2px solid var(--ink);
            white-space: nowrap;
        }

        .expense-meta {
            font-size: 13px;
            line-height: 1.5;
            color: #555;
        }

        .payer-tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            padding: 1px 7px;
            border-radius: 6px;
            border: 1.5px solid var(--ink);
            margin-right: 5px;
            color: var(--ink);
        }

        .note-box {
            background: var(--paper);
            border: 2px dashed var(--ink);
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 12px;
            line-height: 1.5;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-logo">🧾 分帳小幫手</div>
        <div class="nav-links">
            <a href="#transfer" class="nav-btn">轉帳結算</a>
            <a href="#summary" class="nav-btn">互欠總額</a>
            <a href="#details" class="nav-btn">逐筆明細</a>
        </div>
    </header>

    <div class="container">
        <!-- 標題卡 -->
        <div class="card hero-banner">
            <svg viewBox="0 0 360 90" width="100%" height="auto" style="border: 3px solid #3E3A39; border-radius: 14px; background: #FFFCF6; margin-bottom: 8px;">
                <rect x="25" y="18" width="60" height="54" rx="8" fill="#F6D27A" stroke="#3E3A39" stroke-width="3"/>
                <line x1="35" y1="32" x2="75" y2="32" stroke="#3E3A39" stroke-width="3" stroke-linecap="round"/>
                <line x1="35" y1="45" x2="65" y2="45" stroke="#3E3A39" stroke-width="3" stroke-linecap="round"/>
                <line x1="35" y1="58" x2="55" y2="58" stroke="#3E3A39" stroke-width="3" stroke-linecap="round"/>
                <circle cx="145" cy="45" r="22" fill="#A8D3E6" stroke="#3E3A39" stroke-width="3"/>
                <text x="145" y="51" font-size="18" font-weight="bold" text-anchor="middle" fill="#3E3A39">$</text>
                <path d="M185 45 L225 45 M215 35 L225 45 L215 55" stroke="#3E3A39" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="265" cy="45" r="22" fill="#B9DAA5" stroke="#3E3A39" stroke-width="3"/>
                <path d="M255 45 L262 52 L276 38" stroke="#3E3A39" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="325" cy="30" r="8" fill="#F2A497" stroke="#3E3A39" stroke-width="2.5"/>
                <circle cx="318" cy="62" r="6" fill="#D4C1EC" stroke="#3E3A39" stroke-width="2.5"/>
            </svg>
            <h1 class="hero-title">聚餐出遊．費用分攤明細</h1>
            <div class="hero-sub">幣別：新台幣 (NT$) ｜ 點選名字可篩選</div>
        </div>

        <!-- 成員快速篩選 -->
        <div class="filter-bar" id="filterBar">
            <button class="filter-btn active" onclick="setFilter('全部')">全部成員</button>
            <button class="filter-btn" onclick="setFilter('宜君')">宜君</button>
            <button class="filter-btn" onclick="setFilter('冠宏')">冠宏</button>
            <button class="filter-btn" onclick="setFilter('芃文')">芃文</button>
            <button class="filter-btn" onclick="setFilter('陳寶')">陳寶</button>
        </div>

        <!-- 互相抵銷後建議轉帳 -->
        <div id="transfer" class="card" style="background: var(--green);">
            <h2 style="font-size: 18px; margin-bottom: 4px;">💸 互相抵銷後建議轉帳</h2>
            <p style="font-size: 12px; margin-bottom: 12px;">已自動抵銷互欠金額，直接依下列轉帳即可結清（勾選可標記已轉帳）</p>
            <div id="transferList"></div>
        </div>

        <!-- 逐筆互欠總額 -->
        <div id="summary" class="card">
            <h2 style="font-size: 18px; margin-bottom: 10px;">📊 抵銷前．個人互欠總額</h2>
            <div class="debt-grid" id="debtGrid"></div>
            <div class="note-box">
                💡 <strong>備註說明：</strong><br>
                • 整數分攤的零頭依已確認方式由先付款者負擔。<br>
                • 鬆餅金額已含 1 成服務費。<br>
                • 宵夜特選牛肉湯按冠宏、芃文各付宜君 NT$188 記錄；宜君單點自行負擔，未列入分攤。
            </div>
        </div>

        <!-- 逐筆費用明細 -->
        <div id="details" class="card">
            <h2 style="font-size: 18px; margin-bottom: 6px;">📝 逐筆花費明細 (<span id="expenseCount">19</span> 筆)</h2>
            <p style="font-size: 12px; color: #666; margin-bottom: 10px;">列出先付款人、總金額與各人分攤方式</p>
            <div id="expenseList"></div>
        </div>
    </div>

    <script>
        const transfers = [
            { id: 't1', from: '冠宏', to: '宜君', amount: 3280 },
            { id: 't2', from: '芃文', to: '宜君', amount: 3401 },
            { id: 't3', from: '陳寶', to: '宜君', amount: 948 },
            { id: 't4', from: '冠宏', to: '陳寶', amount: 474 },
            { id: 't5', from: '冠宏', to: '芃文', amount: 32 },
            { id: 't6', from: '芃文', to: '陳寶', amount: 749 }
        ];

        const debts = [
            { person: '宜君', owes: ['陳寶 NT$510', '芃文 NT$80', '冠宏 NT$201'] },
            { person: '冠宏', owes: ['宜君 NT$3,481', '陳寶 NT$675', '芃文 NT$233'] },
            { person: '芃文', owes: ['宜君 NT$3,481', '陳寶 NT$799', '冠宏 NT$201'] },
            { person: '陳寶', owes: ['宜君 NT$1,458', '冠宏 NT$201', '芃文 NT$50'] }
        ];

        const expenses = [
            { title: '住宿', total: 'NT$3,670', payer: '宜君', split: '冠宏、芃文各 NT$1,835', members: ['宜君', '冠宏', '芃文'] },
            { title: '去程計程車', total: 'NT$580', payer: '陳寶', split: '4人各 NT$145', members: ['宜君', '冠宏', '芃文', '陳寶'] },
            { title: '博物館門票', total: 'NT$1,920', payer: '宜君', split: '4人各 NT$480', members: ['宜君', '冠宏', '芃文', '陳寶'] },
            { title: '煙波到博物館計程車', total: 'NT$280', payer: '宜君', split: '4人各 NT$70', members: ['宜君', '冠宏', '芃文', '陳寶'] },
            { title: '博物館到國華街計程車', total: 'NT$305', payer: '宜君', split: '宜君 NT$77；冠宏、芃文、陳寶各 NT$76', members: ['宜君', '冠宏', '芃文', '陳寶'] },
            { title: '紅茶', total: 'NT$90', payer: '芃文', split: '宜君 NT$50；冠宏 NT$40', members: ['宜君', '冠宏', '芃文'] },
            { title: '鱔魚麵', total: 'NT$280', payer: '冠宏', split: '4人各 NT$70', members: ['宜君', '冠宏', '芃文', '陳寶'] },
            { title: '麵', total: 'NT$140', payer: '陳寶', split: '4人各 NT$35', members: ['宜君', '冠宏', '芃文', '陳寶'] },
            { title: '草莓大福', total: 'NT$100', payer: '芃文', split: '芃文、陳寶各 NT$50', members: ['芃文', '陳寶'] },
            { title: '牛肉湯', total: 'NT$760', payer: '陳寶', split: '4人各 NT$190', members: ['宜君', '冠宏', '芃文', '陳寶'] },
            { title: '唱歌', total: 'NT$2,596', payer: '宜君', split: '4人各 NT$649', members: ['宜君', '冠宏', '芃文', '陳寶'] },
            { title: '煙波到高鐵計程車', total: 'NT$735', payer: '宜君', split: '宜君 NT$186；冠宏、芃文、陳寶各 NT$183', members: ['宜君', '冠宏', '芃文', '陳寶'] },
            { title: '宵夜特選牛肉湯', total: '分攤 NT$376', payer: '宜君', split: '芃文、冠宏各付宜君 NT$188；單點由宜君負擔', members: ['宜君', '冠宏', '芃文'] },
            { title: '晶英軒烤鴨', total: 'NT$6,820', payer: '芃文', split: '5份各 NT$1,364；芃文和爸爸負擔2份；宜君、冠宏、陳寶各 NT$1,364', members: ['宜君', '冠宏', '芃文', '陳寶'] },
            { title: '高鐵到高雄', total: 'NT$420', payer: '陳寶', split: '宜君、冠宏、陳寶搭乘，各 NT$140', members: ['宜君', '冠宏', '陳寶'] },
            { title: '鬆餅 (含1成服務費)', total: 'NT$594', payer: '陳寶', split: '芃文 NT$429；冠宏 NT$165', members: ['冠宏', '芃文', '陳寶'] },
            { title: '夜市來回計程車', total: 'NT$327', payer: '芃文', split: '芃文、冠宏搭乘；冠宏付芃文 NT$163，芃文負擔 NT$164', members: ['冠宏', '芃文'] },
            { title: '飲料 (更正後)', total: 'NT$90', payer: '芃文', split: '宜君、冠宏各付芃文 NT$30；芃文負擔 NT$30', members: ['宜君', '冠宏', '芃文'] },
            { title: '魷魚、甜不辣、大腸香腸、鹹酥雞', total: 'NT$525', payer: '冠宏', split: '宜君、芃文、陳寶各付冠宏 NT$131；冠宏負擔 NT$132', members: ['宜君', '冠宏', '芃文', '陳寶'] }
        ];

        let currentFilter = '全部';
        let paidStatus = JSON.parse(localStorage.getItem('split_paid_status') || '{}');

        function getBadgeClass(name) {
            if (name === '宜君') return 'p-yijun';
            if (name === '冠宏') return 'p-guanhong';
            if (name === '芃文') return 'p-pengwen';
            if (name === '陳寶') return 'p-chenbao';
            return '';
        }

        function setFilter(name) {
            currentFilter = name;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.includes(name));
            });
            renderAll();
        }

        function togglePaid(id) {
            paidStatus[id] = !paidStatus[id];
            localStorage.setItem('split_paid_status', JSON.stringify(paidStatus));
            renderTransfers();
        }

        function copyAmount(amount, btn) {
            navigator.clipboard.writeText(amount.toString());
            const oldText = btn.innerText;
            btn.innerText = '已複製！';
            setTimeout(() => { btn.innerText = oldText; }, 1200);
        }

        function renderTransfers() {
            const list = document.getElementById('transferList');
            const filtered = currentFilter === '全部'
                ? transfers
                : transfers.filter(t => t.from === currentFilter || t.to === currentFilter);

            list.innerHTML = filtered.map(t => {
                const isDone = !!paidStatus[t.id];
                return `
                <div class="transfer-item ${isDone ? 'done' : ''}">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <input type="checkbox" ${isDone ? 'checked' : ''} onchange="togglePaid('${t.id}')" style="width:18px; height:18px; accent-color:#3E3A39; cursor:pointer;">
                        <div class="transfer-flow">
                            <span class="person-badge ${getBadgeClass(t.from)}">${t.from}</span>
                            <span>➔</span>
                            <span class="person-badge ${getBadgeClass(t.to)}">${t.to}</span>
                        </div>
                    </div>
                    <div class="amount-box">
                        <span class="amount-text">NT$${t.amount.toLocaleString()}</span>
                        <button class="copy-btn" onclick="copyAmount(${t.amount}, this)">複製金額</button>
                    </div>
                </div>
            `}).join('');
        }

        function renderDebts() {
            const grid = document.getElementById('debtGrid');
            const filtered = currentFilter === '全部'
                ? debts
                : debts.filter(d => d.person === currentFilter);

            grid.innerHTML = filtered.map(d => `
                <div class="debt-card">
                    <h4><span class="person-badge ${getBadgeClass(d.person)}">${d.person}</span> 應付：</h4>
                    <div style="line-height: 1.6;">${d.owes.join('<br>')}</div>
                </div>
            `).join('');
        }

        function renderExpenses() {
            const list = document.getElementById('expenseList');
            const filtered = currentFilter === '全部'
                ? expenses
                : expenses.filter(e => e.members.includes(currentFilter));

            document.getElementById('expenseCount').innerText = filtered.length;

            list.innerHTML = filtered.map(e => `
                <div class="expense-item">
                    <div class="expense-header">
                        <div class="expense-title">${e.title}</div>
                        <div class="expense-total">${e.total}</div>
                    </div>
                    <div class="expense-meta">
                        <span class="payer-tag ${getBadgeClass(e.payer)}">先付：${e.payer}</span>
                        <span>${e.split}</span>
                    </div>
                </div>
            `).join('');
        }

        function renderAll() {
            renderTransfers();
            renderDebts();
            renderExpenses();
        }

        renderAll();
    </script>
</body>
</html>
